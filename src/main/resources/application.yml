spring:
  application:
    name: library-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:library}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Un dossier de migrations par module ; les numéros de version sont uniques sur l'ensemble du projet
    locations:
      - classpath:db/migration/catalogue
      - classpath:db/migration/acteurs
      - classpath:db/migration/transactions
      - classpath:db/migration/notifications
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

library:
  loan-days: 14
  penalty-per-day: 500
